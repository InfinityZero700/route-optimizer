
name: Route Optimizer Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Test 100 Bellevue routes
        run: |
          python main.py --place "Bellevue, Washington, USA" --pairs 100 --seed 42

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: outputs/
